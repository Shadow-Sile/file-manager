name: Laravel CI/CD - Wasmer

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: file-manager-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Tests, style and static analysis
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: file_manager_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d file_manager_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, pdo_pgsql, fileinfo, gd, zip, bcmath
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan key:generate --no-interaction
      - run: npm ci
      - run: npm run build
      - name: Verify migrations on PostgreSQL
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_NAME: file_manager_test
          DB_USERNAME: test
          DB_PASSWORD: test
        run: php artisan migrate --force --no-interaction
      - run: php artisan test --compact
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=256M

  package:
    name: Package and boot Laravel in Wasmer
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_pgsql, pdo_sqlite, fileinfo, zip, bcmath
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
      - run: npm ci
      - run: npm run build
      - run: sh docker/prepare-wasmer.sh
      - uses: wasmerio/setup-wasmer@v3.1
      - name: Check runtime and HTTP boot
        env:
          APP_ENV: testing
          APP_DEBUG: 'false'
          SESSION_DRIVER: array
          CACHE_STORE: array
          LOG_CHANNEL: stderr
        shell: bash
        run: |
          set -euo pipefail
          export APP_KEY="$(php artisan key:generate --show --no-interaction)"
          wasmer run . --net \
            --env "APP_KEY=$APP_KEY" --env APP_ENV=testing \
            --env APP_URL=http://localhost:8080 \
            --env SESSION_DRIVER=array --env CACHE_STORE=array \
            --env LOG_CHANNEL=stderr > "$RUNNER_TEMP/wasmer.log" 2>&1 &
          runtime_pid=$!
          trap 'result=$?; if [ $result -ne 0 ]; then cat "$RUNNER_TEMP/wasmer.log"; fi; kill "$runtime_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/up > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$runtime_pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then cat "$RUNNER_TEMP/wasmer.log"; exit 1; fi
          curl --fail --silent http://127.0.0.1:8080/login > /dev/null
          curl --fail --silent http://127.0.0.1:8080/register > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/.env)" = 404
      - uses: actions/upload-artifact@v4
        with:
          name: wasmer-package
          path: |
            .wasmer/app
            wasmer.toml
            app.yaml
            docker/php/php.ini
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Deploy verified package to Wasmer
    needs: package
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wasmer-package
          path: .
      - uses: wasmerio/setup-wasmer@v3.1
      - name: Deploy to Wasmer Edge
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
          WASMER_APP_KEY: ${{ secrets.WASMER_APP_KEY }}
          WASMER_OWNER: ${{ vars.WASMER_OWNER }}
          WASMER_APP_NAME: ${{ vars.WASMER_APP_NAME }}
          WASMER_APP_URL: ${{ vars.WASMER_APP_URL }}
        shell: bash
        run: |
          set -euo pipefail
          : "${WASMER_TOKEN:?Set the WASMER_TOKEN Actions secret}"
          : "${WASMER_APP_KEY:?Set the WASMER_APP_KEY Actions secret}"
          : "${WASMER_OWNER:?Set the WASMER_OWNER Actions variable}"
          : "${WASMER_APP_NAME:?Set the WASMER_APP_NAME Actions variable}"
          : "${WASMER_APP_URL:?Set the WASMER_APP_URL Actions variable}"
          umask 077
          printf 'APP_KEY=%s\nAPP_URL=%s\n' "$WASMER_APP_KEY" "$WASMER_APP_URL" > "$RUNNER_TEMP/wasmer-runtime.env"
          trap 'rm -f "$RUNNER_TEMP/wasmer-runtime.env"' EXIT
          wasmer deploy --non-interactive --owner "$WASMER_OWNER" --name "$WASMER_APP_NAME" --env-file "$RUNNER_TEMP/wasmer-runtime.env"
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 5 "$WASMER_APP_URL/up"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 "$WASMER_APP_URL/login" > /dev/null
