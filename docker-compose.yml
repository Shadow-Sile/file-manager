version: '3.8'

services:
  app:
    image: ghcr.io/${GITHUB_REPOSITORY:-file-manager}:latest
    container_name: file-manager-app
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-file_manager}
      - DB_USERNAME=${DB_USERNAME:-file_manager}
      - DB_PASSWORD=${DB_PASSWORD}
      - APP_URL=${APP_URL:-http://localhost}
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - file-manager-network

  db:
    image: mysql:8.0
    container_name: file-manager-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE:-file_manager}
      - MYSQL_USER=${DB_USERNAME:-file_manager}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - file-manager-network

volumes:
  db_data:
  storage:

networks:
  file-manager-network:
    driver: bridge