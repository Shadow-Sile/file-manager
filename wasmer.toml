[package]
entrypoint = "run"

[dependencies]
"shira/php" = "=8.5.10"

[fs]
"/app" = ".wasmer/app"
"/config" = "docker/php"

[[command]]
name = "run"
module = "shira/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-t", "/app/public", "-S", "0.0.0.0:8080", "/app/wasmer-router.php"]
env = ["PHPRC=/config/"]

[[command]]
name = "migrate"
module = "shira/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["/app/artisan", "migrate", "--force", "--no-interaction"]
env = ["PHPRC=/config/"]
